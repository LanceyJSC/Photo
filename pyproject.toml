[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkroom"
version = "0.1.0"
description = "Background RAW photo editor that grades images in the style you ask for"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8,<5",
  "rawpy>=0.19",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "tifffile>=2023.1",
  "pillow-heif>=0.16",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "scikit-image"]

[project.scripts]
darkroom = "darkroom.cli:main"

[tool.setuptools.packages.find]
include = ["darkroom*"]

[tool.setuptools.package-data]
darkroom = ["web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
